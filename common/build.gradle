plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-common-${minecraft_version}"
}

neoForge {
    neoFormVersion = neo_form_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "com.google.code.gson:gson:2.10.1"
    // SLF4J on the test classpath: production code uses
    // org.slf4j.LoggerFactory (provided by NeoForge at runtime), so without
    // this tests fail to load with NoClassDefFoundError.
    testImplementation "org.slf4j:slf4j-api:2.0.13"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.13"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
