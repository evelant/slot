modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"

[[mixins]]
config = "slot.forge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="emberstextapi"
    mandatory=true
    versionRange="[2.9,)"
    ordering="BEFORE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
