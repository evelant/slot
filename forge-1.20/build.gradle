plugins {
    id 'net.minecraftforge.gradle'
    id 'eclipse'
    id 'idea'
}

// Override allprojects version (set in root build.gradle from
// minecraft_version=1.21.1) to use this module's 1.20.1 target.
version = "${forge_minecraft_version}-${mod_version}"

base {
    archivesName = "${mod_id}-forge-${forge_minecraft_version}"
}

evaluationDependsOn(':common')

minecraft {
    // Mojmap; Parchment requires the org.parchmentmc.librarian.forgegradle
    // plugin to layer on top — defer until/unless devs ask for it.
    mappings channel: 'official', version: forge_minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            taskName 'Client'
        }
        server {
            taskName 'Server'
        }
    }
}

sourceSets {
    main {
        java.srcDirs += project(':common').sourceSets.main.java.srcDirs
        resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs
        // The shared Mixin config targets the modern Java 21 build and is
        // explicitly referenced only by NeoForge's mods.toml. Forge still
        // needs the shared assets/data resources, especially classification.
        resources.exclude 'slot.mixins.json'
    }
    sharedProbe {
        java {
            srcDir project(':common').file('src/main/java')
            srcDir 'src/sharedProbe/java'
            include 'dev/imagio/slot/**'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    sharedProbeImplementation.extendsFrom implementation
    sharedProbeCompileOnly.extendsFrom compileOnly
}

// ForgeGradle 6 ships jarJar disabled by default; enable() activates the
// jarJar task. Note: `jarJar(...)` deps are NOT on the compile classpath —
// you also need an `implementation` (or `compileOnly`) entry, otherwise
// production code can't see the classes.
jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"

    // Taffy: pure-Java layout engine. On modern this is provided transitively
    // via LDLib2's jarjar; here we declare it directly. The `implementation`
    // entry covers compile + dev runtime; the `jarJar` entry bundles it into
    // the shipped jar so production-installed mods are self-contained.
    //
    // transitive=false: Taffy depends on fastutil 8.5.12, but Minecraft 1.20.1
    // already bundles fastutil 8.5.9 and Taffy only uses long-stable classes
    // (FloatList, IntList, Int2FloatMap, Long2ObjectOpenHashMap). Bundling
    // fastutil ourselves bloats the jar by ~23 MB for no benefit.
    implementation "dev.vfyjxf:taffy:${taffy_version}"
    jarJar(group: 'dev.vfyjxf', name: 'taffy', version: "[${taffy_version},${taffy_version}]") {
        transitive = false
    }

    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_forge_version}")

    compileOnly fg.deobf("dev.emi:emi-forge:${forge_emi_version}:api")

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Make jarJar's output the primary jar (what users ship / Prism loads), and
// shove the un-bundled jar to a 'slim' classifier so the default name in
// build/libs has Taffy inside it.
tasks.named('jar') {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'MixinConfigs': 'slot.forge.client.mixins.json'
        ])
    }
}
tasks.named('jarJar') {
    archiveClassifier = ''
    manifest {
        attributes([
                'MixinConfigs': 'slot.forge.client.mixins.json'
        ])
    }
}

tasks.named('compileSharedProbeJava') {
    group = 'verification'
    description = 'Compiles the first Java 17 shared-source slice against Forge 1.20.1.'
}

tasks.named('check') {
    dependsOn tasks.named('compileSharedProbeJava')
}

processResources {
    def replaceProperties = [
            version                      : project.version,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_authors                  : mod_authors,
            mod_description              : mod_description,
            forge_minecraft_version_range: forge_minecraft_version_range,
            forge_loader_version_range   : forge_loader_version_range,
            forge_version_range          : forge_version_range,
            cloth_config_forge_version   : cloth_config_forge_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}
