plugins {
    id 'net.neoforged.moddev' version '2.0.95' apply false
    id 'net.minecraftforge.gradle' version '6.0.24' apply false
}

allprojects {
    group = project.mod_group
    version = "${project.minecraft_version}-${project.mod_version}"
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = project.java_version as int
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'MinecraftForge'
            url = uri('https://maven.minecraftforge.net/')
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org')
        }
        maven {
            name = 'Sponge'
            url = uri('https://repo.spongepowered.org/repository/maven-public/')
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com/')
        }
        maven {
            name = 'FirstDark'
            url = uri('https://maven.firstdark.dev/snapshots')
        }
        maven {
            name = 'Modrinth'
            url = uri('https://api.modrinth.com/maven')
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }
}
