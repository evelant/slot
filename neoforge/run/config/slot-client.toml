#Client-side SLOT settings
[client]
	#Master enable switch for SLOT.
	enabled = true
	#Replaces the vanilla player inventory screen when supported.
	replacePlayerInventory = true
	#Replaces supported chest-like storage screens.
	replaceChestLikeStorage = true
	#Logs SLOT-specific diagnostic events (screen mount, sidebar drag, status-line transitions, cross-surface RPCs). Default on during the prototype so issue reports include the trace; flip to false to silence.
	debugLogging = true
